{{- with .Values.videoSource }}
{{- if .enabled }}
{{- range .settingsYamls -}}
{{- $instanceName := printf "video-source-%s" (lower .id) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $instanceName }}-config
data:
  settings.yaml: |
    {{- toYaml . | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}