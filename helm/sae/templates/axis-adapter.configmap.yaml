{{- with .Values.axisAdapter }}
{{- if .enabled }}
{{- range .instances }}
{{- $instanceName := printf "axis-adapter-%s" (lower .name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $instanceName }}-config
data:
  settings.yaml: |
    {{- toYaml .settingsYaml | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
